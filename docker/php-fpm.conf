[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Sitio institucional liviano (landing + formulario). pm = static con pocos
; workers: memoria predecible y sin combinaciones inválidas de start/spare.
; pm.max_children lo puede reescribir el entrypoint desde PHP_FPM_MAX_CHILDREN.
pm = static
pm.max_children = 8

; Recicla el worker cada 500 peticiones (frena fugas de memoria lentas).
pm.max_requests = 500
request_terminate_timeout = 0

; Logs a stdout/stderr para que Coolify los recoja.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

clear_env = no
