user nginx;
# auto = un worker por núcleo. Nginx solo hace de proxy hacia php-fpm: no es el
# cuello de botella, cada worker maneja miles de conexiones.
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Subidas: la base de conocimiento acepta PDFs y documentos.
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /app/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Assets compilados por Vite: llevan hash en el nombre, así que se pueden
        # cachear para siempre sin miedo a servir una versión vieja.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # CLAVE para Ualdo: el chat es síncrono y espera al proveedor de IA con
            # la petición abierta. Con el bucle de herramientas (MAX_TOOL_STEPS=15 en
            # AIChatService) una respuesta puede encadenar varias llamadas y tardar
            # minutos. El defecto de nginx son 60s: con él, las respuestas largas de
            # Ualdo morirían en un 504 justo cuando más trabajo ha hecho.
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Nada de servir .env, .git ni ficheros ocultos.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
