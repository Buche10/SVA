; Producción — NexoTeams / Ualdo

memory_limit = 256M
max_execution_time = 300
post_max_size = 50M
upload_max_filesize = 50M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = America/Guayaquil

; OPcache: sin esto PHP recompila cada archivo en cada petición. Es la diferencia
; más grande y más barata entre `php artisan serve` y una imagen de producción.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; 0 = no comprobar si los archivos cambiaron. El código es inmutable dentro de la
; imagen: cada despliegue construye una imagen nueva, así que revalidar es gasto
; puro. Si alguna vez editas código dentro del contenedor en caliente, no verás
; los cambios — eso es intencionado.
opcache.validate_timestamps = 0
opcache.save_comments = 1
