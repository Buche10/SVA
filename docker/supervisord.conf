; Supervisa nginx + php-fpm en el contenedor web. Los recursos de worker,
; scheduler y reverb usan la MISMA imagen pero sobrescriben el comando en
; Coolify, así que no pasan por aquí.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
; Después de php-fpm: si nginx arranca primero, las primeras peticiones darían
; 502 mientras el socket de fpm todavía no escucha.
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Si php-fpm (o nginx) se rinde tras agotar los reintentos, MATA el contenedor.
; Sin esto, supervisor se queda vivo con nginx arriba y php-fpm muerto: el
; contenedor reporta "running" mientras devuelve 502 a cada petición — verde en
; Coolify, caído para el usuario. Prefiero que Coolify vea el contenedor caerse y
; lo reinicie (restart: always) a que sirva errores creyéndose sano.
[eventlistener:quit_on_fatal]
events=PROCESS_STATE_FATAL
command=sh -c 'printf "READY\n"; while read -r line; do kill -SIGQUIT $PPID; printf "RESULT 2\nOK"; done'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
